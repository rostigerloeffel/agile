<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Softwareentwicklung</title>

    <!-- Reveal.js CSS -->
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css">
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/black.css" id="theme">

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="node_modules/reveal.js/plugin/highlight/monokai.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <div class="reveal">
        <div class="slides">

            <!-- Slides are loaded from external Markdown file -->
            <section data-markdown="slides.md"
                     data-separator="^\r?\n---\r?\n$"
                     data-separator-vertical="^\r?\n--\r?\n$"
                     data-separator-notes="^Note:"
                     data-charset="utf-8">
            </section>

        </div>
    </div>

    <!-- Reveal.js Scripts -->
    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script src="node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="node_modules/reveal.js/plugin/highlight/highlight.js"></script>
    <script src="node_modules/reveal.js/plugin/zoom/zoom.js"></script>
    <script src="node_modules/reveal.js/plugin/search/search.js"></script>

    <!-- Initialize Reveal.js -->
    <script>
        Reveal.initialize({
            // Display settings
            hash: true,
            width: 1280,
            height: 720,
            margin: 0.1,

            // Navigation
            controls: true,
            progress: true,
            center: true,

            // Transitions
            transition: 'slide', // none/fade/slide/convex/concave/zoom
            transitionSpeed: 'default', // default/fast/slow

            // Plugins
            plugins: [
                RevealMarkdown,
                RevealHighlight,
                RevealNotes,
                RevealZoom,
                RevealSearch
            ]
        });
    </script>
</body>
</html>
