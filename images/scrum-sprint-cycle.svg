<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .event-box { fill: #2196F3; stroke: #1976D2; stroke-width: 2; }
      .artifact-box { fill: #7E57C2; stroke: #5E35B1; stroke-width: 2; }
      .sprint-container { fill: none; stroke: #FF9800; stroke-width: 4; stroke-dasharray: 10,5; }
      .text-white { fill: white; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-dark { fill: #333; font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .text-label { fill: #FF9800; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .cycle-arrow { stroke: #4CAF50; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4CAF50" />
    </marker>
  </defs>

  <!-- Sprint Container -->
  <rect class="sprint-container" x="50" y="80" width="700" height="440" rx="20" />
  <text class="text-label" x="400" y="60">SPRINT (1-4 Wochen)</text>

  <!-- Product Backlog (Input) -->
  <rect class="artifact-box" x="30" y="240" width="140" height="60" rx="5" />
  <text class="text-white" x="100" y="265">Product</text>
  <text class="text-white" x="100" y="283">Backlog</text>

  <!-- Sprint Planning -->
  <rect class="event-box" x="220" y="110" width="140" height="60" rx="5" />
  <text class="text-white" x="290" y="135">Sprint Planning</text>
  <text class="text-dark" x="290" y="153">(bis 8h)</text>

  <!-- Arrow from Product Backlog to Sprint Planning -->
  <path class="arrow" d="M 170 270 L 220 145" />

  <!-- Sprint Backlog -->
  <rect class="artifact-box" x="220" y="200" width="140" height="60" rx="5" />
  <text class="text-white" x="290" y="225">Sprint</text>
  <text class="text-white" x="290" y="243">Backlog</text>

  <!-- Arrow from Planning to Sprint Backlog -->
  <path class="arrow" d="M 290 170 L 290 200" />

  <!-- Daily Scrum (center, multiple) -->
  <circle class="event-box" cx="400" cy="280" r="45" />
  <text class="text-white" x="400" y="275">Daily Scrum</text>
  <text class="text-dark" x="400" y="293">(15 min)</text>

  <!-- Small circles indicating multiple dailies -->
  <circle class="event-box" cx="370" cy="320" r="20" opacity="0.6" />
  <circle class="event-box" cx="400" cy="330" r="20" opacity="0.6" />
  <circle class="event-box" cx="430" cy="320" r="20" opacity="0.6" />
  <text class="text-dark" x="400" y="370" font-size="11px">täglich</text>

  <!-- Arrow from Sprint Backlog to Daily -->
  <path class="arrow" d="M 360 230 L 370 260" />

  <!-- Increment (Working Software) -->
  <rect class="artifact-box" x="520" y="240" width="140" height="60" rx="5" />
  <text class="text-white" x="590" y="260">Increment</text>
  <text class="text-dark" x="590" y="278">(Working</text>
  <text class="text-dark" x="590" y="293">Software)</text>

  <!-- Arrow from Daily to Increment -->
  <path class="arrow" d="M 440 280 L 520 270" />

  <!-- Sprint Review -->
  <rect class="event-box" x="520" y="350" width="140" height="60" rx="5" />
  <text class="text-white" x="590" y="375">Sprint Review</text>
  <text class="text-dark" x="590" y="393">(bis 4h)</text>

  <!-- Arrow from Increment to Review -->
  <path class="arrow" d="M 590 300 L 590 350" />

  <!-- Sprint Retrospective -->
  <rect class="event-box" x="520" y="450" width="140" height="60" rx="5" />
  <text class="text-white" x="590" y="472">Sprint</text>
  <text class="text-white" x="590" y="488">Retrospective</text>
  <text class="text-dark" x="590" y="503">(bis 3h)</text>

  <!-- Arrow from Review to Retro -->
  <path class="arrow" d="M 590 410 L 590 450" />

  <!-- Cycle arrow back to next Sprint -->
  <path class="cycle-arrow" d="M 520 480 Q 400 540, 280 480 Q 200 440, 220 380 L 220 340" />
  <text fill="#4CAF50" x="350" y="555" font-size="14px" font-weight="bold" text-anchor="middle">Nächster Sprint</text>

  <!-- Roles (bottom) -->
  <g transform="translate(100, 545)">
    <text fill="#333" font-size="13px" font-weight="bold">👥 Rollen:</text>
    <text fill="#555" x="70" font-size="12px">Product Owner</text>
    <text fill="#555" x="180" font-size="12px">Scrum Master</text>
    <text fill="#555" x="280" font-size="12px">Development Team</text>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 100)">
    <rect class="event-box" width="30" height="20" rx="3" />
    <text fill="#333" x="40" y="14" font-size="11px" text-anchor="start">Events</text>

    <rect class="artifact-box" y="30" width="30" height="20" rx="3" />
    <text fill="#333" x="40" y="44" font-size="11px" text-anchor="start">Artefakte</text>
  </g>
</svg>
